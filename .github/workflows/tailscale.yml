name: Windows Tailscale RDP/SSH

on:
  workflow_dispatch:

jobs:
  remote-windows:
    runs-on: windows-latest
    steps:
      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          # Cài đặt Tailscale bằng Chocolatey
          choco install tailscale -y

          # Kích hoạt kết nối Tailscale
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set Password & Show IP
        shell: powershell
        run: |
          # Đặt mật khẩu cho tài khoản runneradmin
          net user runneradmin PassCuaBan123!

          # In IP Tailscale ra Log
          Write-Host "=========================================="
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "User: runneradmin"
          Write-Host "Pass: PassCuaBan123!"
          Write-Host "=========================================="

      - name: Keep Alive (Chạy trong 1 tiếng)
        shell: powershell
        run: Start-Sleep -Seconds 3600
        
